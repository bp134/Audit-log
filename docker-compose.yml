version: "3.9"

services:
  # 1. Slack Socket Mode Task Bot & Tranche Scheduler (Morning / Mid-Day / End-of-Day)
  slack-compliance-bot:
    build: .
    container_name: pharmacy_slack_compliance_bot
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    command: python -m src.slack_bot.service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - compliance_data:/app/data

  # 2. Entra ID Compliance & GPhC Inspection Dashboard (Streamlit UI — ID-007: bound to 127.0.0.1 for reverse-proxy TLS termination)
  compliance-dashboard:
    build: .
    container_name: pharmacy_compliance_dashboard
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    ports:
      - "127.0.0.1:8501:8501"
    command: streamlit run src/dashboard/app.py --server.port=8501 --server.address=0.0.0.0 --server.enableCORS=true --server.enableXsrfProtection=true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - compliance_data:/app/data

  # 3. Nightly Encrypted Hetzner S3 Archival & Automated "Break-Glass" Restore Verifier
  backup-break-glass-verifier:
    build: .
    container_name: pharmacy_backup_verifier
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    command: python -m src.backup.service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - compliance_data:/app/data
      - s3_staging_vault:/app/s3_vault

volumes:
  compliance_data:
  s3_staging_vault:
