name: Pharmacy Compliance CI & Security Gate (ID-027)

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  compliance-verification:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharmacy_compliance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pharmacy_compliance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENV: development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pharmacy_compliance_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pharmacy_compliance_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12 and PostgreSQL client tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install postgresql-client-18 (pg_dump 18 matching PostgreSQL 18 server)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg lsb-release postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          sudo ln -sf /usr/lib/postgresql/18/bin/pg_dump /usr/local/bin/pg_dump
          pg_dump --version

      - name: Install pinned application dependencies and security gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff pytest bandit pip-audit

      - name: Gate 1 — Ruff Syntax & Error Check
        run: python -m ruff check --select E9,F63,F7,F82 src tests

      - name: Gate 2 — Bandit Static Security Analysis (SAST)
        run: python -m bandit -q -r src/

      - name: Gate 3 — Dependency Vulnerability Audit (pip-audit)
        run: python -m pip_audit -r requirements.txt --no-deps --progress-spinner off

      - name: Gate 4 — Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate 5 — Full PostgreSQL 18 Unit, Integration & Break-Glass Suite
        run: python -B -m pytest -q
